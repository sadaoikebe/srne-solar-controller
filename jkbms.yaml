# JK-BMS bank configuration (read-only monitoring).
# Used by jkbms_client CLI and jkbms_api background poller.

# How often each bank is polled over an existing BLE connection.
# Scan+connect is serialized on the one radio; frame waits are independent.
poll_interval_s: 10

# Wait for a cell-info notify after a 0x96 query (keep-alive).
read_timeout_s: 8

banks:
  a:
    serial: "40904495693"
    mac: "98:DA:20:09:98:80"
  b:
    serial: "41101490573"
    mac: "98:DA:20:06:85:65"
