# OPTIONAL emergency / isolated JK-BMS stack.
# Prefer the jkbms_* services in compose.yaml (production) for normal operation.
# Do NOT run this project at the same time as production jkbms_db_writer
# (double Influx writes).
#
#   docker compose -f compose.jkbms.yaml -p jkbms up -d --build
#   docker compose -f compose.jkbms.yaml -p jkbms down
#
# Host BlueZ + network_mode: host; API on :5005.

name: jkbms

services:
  jkbms_api:
    build:
      context: .
      dockerfile: Dockerfile.jkbms
    image: jkbms-api:latest
    container_name: jkbms_api
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - JKBMS_API_HOST=0.0.0.0
      - JKBMS_API_PORT=${JKBMS_API_PORT:-5005}
      - JKBMS_CONFIG=/app/jkbms.yaml
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/var/run/dbus/system_bus_socket
    volumes:
      # Host bluetoothd D-Bus socket (required for bleak).
      - /var/run/dbus:/var/run/dbus
      # Live config without rebuild.
      - ./jkbms.yaml:/app/jkbms.yaml:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Optional: match host bluetooth group if present inside the image.
    # group_add:
    #   - "108"
    healthcheck:
      # Accept ok or degraded (one bank down); fail while still starting.
      # Port matches JKBMS_API_PORT default (5005) under network_mode: host.
      test:
        [
          "CMD-SHELL",
          # JSON is compact (no spaces). Match ok or degraded.
          "curl -fsS http://127.0.0.1:5005/health | grep -Eq '\"status\":\"(ok|degraded)\"' || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s

  # Writes measurement `jkbms` into the *existing* production InfluxDB.
  # Does not start or modify production db_writer.
  # Under network_mode: host, use 127.0.0.1 for both API and Influx.
  # Provide secrets via project .env or:
  #   docker compose --env-file ../srne-solar-controller/.env -f compose.jkbms.yaml -p jkbms up -d
  jkbms_db_writer:
    image: jkbms-api:latest
    build:
      context: .
      dockerfile: Dockerfile.jkbms
    container_name: jkbms_db_writer
    restart: unless-stopped
    network_mode: host
    command: ["python", "jkbms_db_writer.py"]
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JKBMS_API_URL=${JKBMS_API_URL:-http://127.0.0.1:5005/bms}
      # Override docker-internal hostname when using host network.
      - INFLUX_URL=${INFLUX_URL_HOST:-http://127.0.0.1:8086}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
    depends_on:
      jkbms_api:
        condition: service_healthy
