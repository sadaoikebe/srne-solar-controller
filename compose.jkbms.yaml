# OPTIONAL emergency / isolated JK-BMS stack.
# Prefer the jkbms_* services in compose.yaml for normal operation.
# Do NOT run this project at the same time as production jkbms_db_writer
# (double Influx writes).
#
# Uses the shared srne-app:latest image (build via main compose first).
#
#   docker compose -f compose.jkbms.yaml -p jkbms up -d
#   docker compose -f compose.jkbms.yaml -p jkbms down
#
# Host BlueZ + network_mode: host; API on :5005.

name: jkbms

services:
  jkbms_api:
    image: srne-app:latest
    container_name: jkbms_api
    restart: unless-stopped
    network_mode: host
    command: ["python", "jkbms_api.py"]
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - JKBMS_API_HOST=0.0.0.0
      - JKBMS_API_PORT=${JKBMS_API_PORT:-5005}
      - JKBMS_CONFIG=/app/jkbms.yaml
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/var/run/dbus/system_bus_socket
    volumes:
      - .:/app
      - /var/run/dbus:/var/run/dbus
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:5005/health | grep -Eq '\"status\":\"(ok|degraded)\"' || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s

  jkbms_db_writer:
    image: srne-app:latest
    container_name: jkbms_db_writer
    restart: unless-stopped
    network_mode: host
    command: ["python", "jkbms_db_writer.py"]
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JKBMS_API_URL=${JKBMS_API_URL:-http://127.0.0.1:5005/bms}
      - INFLUX_URL=${INFLUX_URL_HOST:-http://127.0.0.1:8086}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
    volumes:
      - .:/app
    depends_on:
      jkbms_api:
        condition: service_healthy
