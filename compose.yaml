services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports: ["8086:8086"]
    environment:
      - TZ=${TZ}
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_RETENTION=${INFLUX_RETENTION:-0}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    volumes:
      - /var/lib/influxdb2:/var/lib/influxdb2
      - /etc/influxdb2:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:12.4.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${USERNAME}
      - GF_SECURITY_ADMIN_PASSWORD=${PASSWORD}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      # Optional; only if a dashboard queries the raw bucket.
      - INFLUX_BUCKET_RAW=${INFLUX_BUCKET_RAW:-}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - influxdb

  modbus_api:
    build: .
    image: srne-app:latest
    container_name: modbus_api
    restart: unless-stopped
    command: uvicorn modbus_api:app --host 0.0.0.0 --port ${MODBUS_API_PORT:-5004}
    environment:
      - BASIC_AUTH_USER=${USERNAME}
      - BASIC_AUTH_PASS=${PASSWORD}
      - MODBUS_API_PORT=${MODBUS_API_PORT:-5004}
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - CONFIG_PATH=/app/targets.json
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "${MODBUS_API_PORT:-5004}:${MODBUS_API_PORT:-5004}"
    volumes:
      - .:/app
    # Grant access to USB-serial adapters only — safer than privileged: true.
    # Adjust device paths if your adapters appear on different /dev/ttyUSBN nodes
    # (check with: ls -la /dev/ttyUSB*  or  python3 -m serial.tools.list_ports -v)
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyUSB1:/dev/ttyUSB1
    group_add:
      - dialout
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5004/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  db_writer:
    image: srne-app:latest
    container_name: db_writer
    restart: unless-stopped
    working_dir: /app
    command: python db_writer.py
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      # Optional: separate bucket for raw uint16 capture of Growatt regs 0–95.
      # Leave INFLUX_BUCKET_RAW unset in .env to disable the raw tier.
      - INFLUX_BUCKET_RAW=${INFLUX_BUCKET_RAW:-}
      - MODBUS_API_PORT=${MODBUS_API_PORT:-5004}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - .:/app
    depends_on:
      modbus_api:
        condition: service_healthy
      influxdb:
        condition: service_healthy

  battery_controller:
    image: srne-app:latest
    container_name: battery_controller
    restart: unless-stopped
    command: python battery_controller.py
    environment:
      - CONFIG_PATH=/app/targets.json
      - MODBUS_API_PORT=${MODBUS_API_PORT:-5004}
      - BASIC_AUTH_USER=${USERNAME}
      - BASIC_AUTH_PASS=${PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - .:/app
    depends_on:
      modbus_api:
        condition: service_healthy

  daily_target:
    build: .
    image: srne-app:latest
    container_name: daily_target
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - TZ=${TZ}
      - CONFIG_PATH=/app/targets.json
      - MODBUS_API_PORT=${MODBUS_API_PORT:-5004}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - PLANNER_LAT=${PLANNER_LAT:-34.6903}
      - PLANNER_LON=${PLANNER_LON:-135.1955}
    command: ["supercronic", "/app/crontab"]
    depends_on:
      modbus_api:
        condition: service_healthy
      influxdb:
        condition: service_healthy

  # JK-BMS BLE telemetry (read-only). Same image as the rest of the stack.
  # network_mode: host is required for reliable BlueZ access on this Pi.
  # Port 5005 is the HTTP cache API (modbus_api remains on 5004).
  jkbms_api:
    image: srne-app:latest
    container_name: jkbms_api
    restart: unless-stopped
    network_mode: host
    command: ["python", "jkbms_api.py"]
    environment:
      - TZ=${TZ}
      - JKBMS_API_HOST=0.0.0.0
      - JKBMS_API_PORT=${JKBMS_API_PORT:-5005}
      - JKBMS_CONFIG=/app/jkbms.yaml
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/var/run/dbus/system_bus_socket
    volumes:
      - .:/app
      - /var/run/dbus:/var/run/dbus
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:5005/health | grep -Eq '\"status\":\"(ok|degraded)\"' || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s

  # Writes measurement `jkbms` to Influx (does not touch modbus db_writer).
  # Host network → talk to Influx on published host port 8086.
  jkbms_db_writer:
    image: srne-app:latest
    container_name: jkbms_db_writer
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    command: ["python", "jkbms_db_writer.py"]
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JKBMS_API_URL=${JKBMS_API_URL:-http://127.0.0.1:5005/bms}
      - INFLUX_URL=http://127.0.0.1:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
    volumes:
      - .:/app
    depends_on:
      jkbms_api:
        condition: service_healthy
      influxdb:
        condition: service_healthy

  # Shadow SoC estimator — writes measurement soc_estimate. Does not steer SBU/UTI.
  soc_estimator:
    image: srne-app:latest
    container_name: soc_estimator
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    command: ["python", "soc_estimator.py"]
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SOC_ESTIMATOR_CONFIG=/app/soc_estimator.yaml
      - SOC_ESTIMATOR_STATE=/app/soc_estimator_state.json
      - JKBMS_API_URL=${JKBMS_API_URL:-http://127.0.0.1:5005/bms}
      - BATTERY_CURRENTS_URL=http://127.0.0.1:5004/battery_currents
      - INFLUX_URL=http://127.0.0.1:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
    volumes:
      - .:/app
    depends_on:
      jkbms_api:
        condition: service_healthy
      influxdb:
        condition: service_healthy

volumes:
  grafana-data:
